name: ci-cd-gitops
on:
  push:
    branches: [ "main" ]
jobs:
  build-push-update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set image tag
      run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tp-gitops:${{ env.IMAGE_TAG }}

    - name: Update manifest
      run: |
        IMAGE_NAME="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tp-gitops:${IMAGE_TAG}"
        sed -i "s|image: .*|image: ${IMAGE_NAME}|g" k8s/deployment.yaml

    - name: Commit manifest
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        git add k8s/deployment.yaml
        git commit -m "chore: update image tag to ${IMAGE_TAG}" || echo "No changes"
        git push